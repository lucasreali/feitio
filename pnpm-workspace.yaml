packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Download telemetry from swagger-ui-dist; not needed to serve the docs.
  "@scarf/scarf": false

saveExact: true

# Minutes (7 days): only resolve versions published at least this long ago.
minimumReleaseAge: 10080
