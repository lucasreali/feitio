name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # Pinned: ubuntu-latest moves to Ubuntu 26 from October 19, 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # The same disposable services and values as a local run.
      - name: Prepare e2e services
        run: |
          cp apps/api/.env.test.example apps/api/.env.test
          pnpm --filter api test:e2e:setup

      - name: API e2e tests
        run: pnpm --filter api test:e2e
